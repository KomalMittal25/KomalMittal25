name: Refresh contribution snake

on:
  schedule:
    # Daily at 05:30 UTC (11:00 IST)
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-heatmap
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Public calendar data only; no token is written anywhere.
      - name: Fetch contributions
        env:
          # Always the main account, so this preview repo shows the real profile.
          GH_USERNAME: Komal25-ux
        run: node scripts/fetch-contributions.mjs

      - name: Render snake SVG
        run: node scripts/build-heatmap-svg.mjs

      - name: Commit if changed
        run: |
          git add data/contributions.json assets/contribution-snake.svg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contribution snake"
          git push
