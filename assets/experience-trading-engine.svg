<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="ex-t">
  <title id="ex-t">NSE Trading Engine: a 24/7 opening-range-breakout engine for NSE equities, built as Python Engineering Intern at Meevick Enterprises.</title>
  <defs>
    <linearGradient id="ex-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1230"/><stop offset="1" stop-color="#070B1F"/>
    </linearGradient>
    <radialGradient id="ex-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#2647C8" stop-opacity=".55"/><stop offset="1" stop-color="#172B78" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ex-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#6F8FF7" stroke-opacity=".08"/>
    </pattern>
    <filter id="ex-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ex-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="ex-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/><stop offset=".45" stop-color="#B9CBFF"/><stop offset="1" stop-color="#6F8FF7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .ex-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ex-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ex-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ex-in { animation: ex-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .ex-d1 { animation-delay: .15s; } .ex-d2 { animation-delay: .4s; }
    .ex-chip { animation: ex-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes ex-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .ex-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: ex-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .ex-draw-late { stroke-dasharray: 600; stroke-dashoffset: 600; animation: ex-draw 2.6s cubic-bezier(.65,0,.35,1) 1.4s forwards; }
    .ex-pop { animation: ex-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .ex-bar { transform-box: fill-box; transform-origin: center; animation: ex-bar 1.1s ease-in-out infinite alternate; }
    @keyframes ex-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes ex-draw { to { stroke-dashoffset: 0; } }
    @keyframes ex-bar { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .ex-in, .ex-chip, .ex-pop, .ex-bar { animation: none; } .ex-draw, .ex-draw-late { animation: none; stroke-dashoffset: 0; } }
    .ex-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: ex-trace 7s linear infinite; }
    @keyframes ex-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ex-trace { display: none; } }
  </style>
  <g clip-path="url(#ex-clip)">
    <rect width="1200" height="370" fill="url(#ex-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#ex-grid)"/>
    <rect width="1200" height="370" fill="url(#ex-glow)"/>
    <g class="ex-in ex-d1">
      <text class="ex-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#6F8FF7">EXPERIENCE · MEEVICK ENTERPRISES · JUN – JUL 2026</text>
      <text class="ex-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#EEF2FF">Trading Engine<tspan class="ex-serif" font-size="22" font-style="italic" fill="#B9CBFF" dx="14">Python Engineering Intern</tspan></text>
      <text class="ex-sans" x="56" y="166" font-size="17" fill="#A5AFCB">A 24/7 breakout engine for NSE equities, gated by a sector-index vote.</text>
      <text class="ex-mono" x="56" y="200" font-size="12.5" fill="#B9CBFF"><tspan fill="#6F8FF7">BUILT ›</tspan> Upstox REST behind a self-healing 401 replay · rate limits</text>
      <line class="ex-draw" x1="56" y1="226" x2="680" y2="226" stroke="#6F8FF7" stroke-opacity=".32"/>
    <g transform="translate(56 266)"><text class="ex-serif" font-size="34" font-weight="300" fill="#EEF2FF">18</text><text class="ex-sans" y="24" font-size="12.5" fill="#A5AFCB">rung trailing stop-loss</text></g>
    <g transform="translate(261 266)"><text class="ex-serif" font-size="34" font-weight="300" fill="#EEF2FF">₹3,000</text><text class="ex-sans" y="24" font-size="12.5" fill="#A5AFCB">hard stop, never breached</text></g>
    <g transform="translate(466 266)"><text class="ex-serif" font-size="34" font-weight="300" fill="#EEF2FF">24/7</text><text class="ex-sans" y="24" font-size="12.5" fill="#A5AFCB">on AWS EC2 with cron</text></g>
      <g class="ex-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="63" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="ex-mono" x="87.5" y="331" text-anchor="middle" font-size="11.5" fill="#B9CBFF">Python</text></g><g class="ex-chip" style="animation-delay:1.12s"><rect x="127" y="314" width="63" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="ex-mono" x="158.5" y="331" text-anchor="middle" font-size="11.5" fill="#B9CBFF">Pandas</text></g><g class="ex-chip" style="animation-delay:1.24s"><rect x="198" y="314" width="91" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="ex-mono" x="243.5" y="331" text-anchor="middle" font-size="11.5" fill="#B9CBFF">Upstox API</text></g><g class="ex-chip" style="animation-delay:1.36s"><rect x="297" y="314" width="70" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="ex-mono" x="332" y="331" text-anchor="middle" font-size="11.5" fill="#B9CBFF">AWS EC2</text></g><g class="ex-chip" style="animation-delay:1.48s"><rect x="375" y="314" width="49" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="ex-mono" x="399.5" y="331" text-anchor="middle" font-size="11.5" fill="#B9CBFF">cron</text></g><g class="ex-chip" style="animation-delay:1.60s"><rect x="432" y="314" width="77" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="ex-mono" x="470.5" y="331" text-anchor="middle" font-size="11.5" fill="#B9CBFF">Telegram</text></g>
    </g>
