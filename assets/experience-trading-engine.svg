F8FF7" stroke-opacity=".7"/><rect x="960" y="204" width="12" height="12" rx="2" fill="none" stroke="#6F8FF7" stroke-opacity="0.7"/></g><g class="ex-pop" style="animation-delay:1.71s"><line x1="988" y1="180" x2="988" y2="220" stroke="#B9CBFF" stroke-opacity=".7"/><rect x="982" y="186" width="12" height="30" rx="2" fill="#4169E1" stroke="#B9CBFF" stroke-opacity="0.9"/></g><g class="ex-pop" style="animation-delay:1.80s"><line x1="1010" y1="168" x2="1010" y2="192" stroke="#B9CBFF" stroke-opacity=".7"/><rect x="1004" y="176" width="12" height="10" rx="2" fill="#4169E1" stroke="#B9CBFF" stroke-opacity="0.9"/></g><g class="ex-pop" style="animation-delay:1.89s"><line x1="1032" y1="172" x2="1032" y2="194" stroke="#6F8FF7" stroke-opacity=".7"/><rect x="1026" y="176" width="12" height="12" rx="2" fill="none" stroke="#6F8FF7" stroke-opacity="0.7"/></g><g class="ex-pop" style="animation-delay:1.98s"><line x1="1054" y1="154" x2="1054" y2="192" stroke="#B9CBFF" stroke-opacity=".7"/><rect x="1048" y="160" width="12" height="28" rx="2" fill="#4169E1" stroke="#B9CBFF" stroke-opacity="0.9"/></g><g class="ex-pop" style="animation-delay:2.07s"><line x1="1076" y1="140" x2="1076" y2="166" stroke="#B9CBFF" stroke-opacity=".7"/><rect x="1070" y="148" width="12" height="12" rx="2" fill="#4169E1" stroke="#B9CBFF" stroke-opacity="0.9"/></g><g class="ex-pop" style="animation-delay:2.16s"><line x1="1098" y1="142" x2="1098" y2="160" stroke="#6F8FF7" stroke-opacity=".7"/><rect x="1092" y="148" width="12" height="6" rx="2" fill="none" stroke="#6F8FF7" stroke-opacity="0.7"/></g><g class="ex-pop" style="animation-delay:2.25s"><line x1="1120" y1="124" x2="1120" y2="158" stroke="#B9CBFF" stroke-opacity=".7"/><rect x="1114" y="132" width="12" height="22" rx="2" fill="#4169E1" stroke="#B9CBFF" stroke-opacity="0.9"/></g>
        <path class="ex-draw-late" d="M914 250 H974 V234 H1018 V206 H1062 V196 H1084 V176 H1130 V164" fill="none" stroke="#C9A27A" stroke-width="1.6" stroke-dasharray="600"/>
        <text x="1176" y="218" font-size="9.5" letter-spacing="1.4" fill="#C9A27A" text-anchor="end">TRAIL SL · 18 RUNGS</text>
        <g class="ex-pop" style="animation-delay:1.6s"><path d="M922 198 v-14 m-4 4 l4 -4 l4 4" fill="none" stroke="#B9CBFF"/><text x="914" y="190" font-size="9.5" letter-spacing="1.4" fill="#B9CBFF" text-anchor="end">BREAKOUT</text></g>
