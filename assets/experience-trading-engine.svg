          <animateMotion dur="5s" begin="2.2s" repeatCount="indefinite" path="M0 0 L22 22 L44 5 L66 12 L88 -2 L110 4 L132 -24 L154 -32 L176 -20 L198 -50 L220 -60 L242 -48 L264 -76 L286 -88 L308 -82 L330 -104" calcMode="linear"/>
        </circle>
        <text x="772" y="326" font-size="10.5" letter-spacing="1.5" fill="#A5AFCB">paper-traded on live prices · Telegram alerts</text>
      </g>
    </g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#6F8FF7" stroke-opacity=".22"/>
    <rect class="ex-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#ex-trace)" stroke-width="1.6" stroke-linecap="round"/>
