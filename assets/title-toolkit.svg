<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 136" width="1200" height="136" role="img" aria-label="05 Toolkit: The tools I reach for.">
  <defs>
    <linearGradient id="tto-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#6F8FF7"/><stop offset=".6" stop-color="#2647C8"/><stop offset="1" stop-color="#2647C8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tto-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#B9CBFF"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9CBFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="tto-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1230"/><stop offset="1" stop-color="#070B1F"/></linearGradient>
    <radialGradient id="tto-glow" cx="12%" cy="0%" r="60%"><stop offset="0" stop-color="#2647C8" stop-opacity=".45"/><stop offset="1" stop-color="#2647C8" stop-opacity="0"/></radialGradient>
    <radialGradient id="tto-pulse"><stop offset="0" stop-color="#EEF2FF"/><stop offset=".5" stop-color="#B9CBFF" stop-opacity=".6"/><stop offset="1" stop-color="#6F8FF7" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .tto-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tto-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tto-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tto-in { animation: tto-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tto-d2 { animation-delay: .2s; } .tto-d3 { animation-delay: .45s; }
    .tto-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: tto-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes tto-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes tto-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tto-in { animation: none; } .tto-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <!-- Solid card, so the heading reads on GitHub's light and dark themes alike -->
  <rect width="1200" height="136" rx="20" fill="url(#tto-bg)"/>
  <rect width="1200" height="136" rx="20" fill="url(#tto-glow)"/>
  <rect x=".5" y=".5" width="1199" height="135" rx="19.5" fill="none" stroke="#6F8FF7" stroke-opacity=".2"/>
  <g transform="translate(16 12)">
  <g class="tto-in">
    <text class="tto-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#6F8FF7"><tspan fill="#B9CBFF">05</tspan>   TOOLKIT</text>
  </g>
  <g class="tto-in tto-d2">
    <text class="tto-serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#EEF2FF">The tools <tspan font-style="italic" fill="url(#tto-sheen)">I reach for.</tspan></text>
  </g>
  <g class="tto-in tto-d3">
    <text class="tto-mono" x="1136" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#A5AFCB">STACK</text>
  </g>
  <path class="tto-draw" d="M40 106 H1136" stroke="url(#tto-line)" stroke-width="1"/>
  <circle cx="40" cy="106" r="7" fill="url(#tto-pulse)" opacity="0">
    <animate attributeName="cx" values="40;1136" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
  </g>
</svg>
