<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="sig-title">
  <title id="sig-title">Komal — Agents that listen. Systems that hold.</title>
  <defs>
    <linearGradient id="sig-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B1F"/>
      <stop offset="1" stop-color="#0B1230"/>
    </linearGradient>
    <radialGradient id="sig-glow" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#2647C8" stop-opacity=".6"/>
      <stop offset="1" stop-color="#172B78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sig-line" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="1100" y2="0">
      <stop offset="0" stop-color="#2647C8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6F8FF7"/>
      <stop offset="1" stop-color="#2647C8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sig-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .sig-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sig-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sig-name {
      stroke: #B9CBFF; stroke-width: 1; fill: #B9CBFF; fill-opacity: 0;
      stroke-dasharray: 900; stroke-dashoffset: 900;
      animation: sig-write 3.6s cubic-bezier(.65,0,.35,1) .3s forwards;
    }
    .sig-rule { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: sig-draw 2.4s cubic-bezier(.65,0,.35,1) 1.6s forwards; }
    .sig-in { animation: sig-in 1.4s ease 2.6s both; }
    @keyframes sig-write { 70% { stroke-dashoffset: 0; fill-opacity: 0; } 100% { stroke-dashoffset: 0; fill-opacity: 1; } }
    @keyframes sig-draw { to { stroke-dashoffset: 0; } }
    @keyframes sig-in { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .sig-name { animation: none; stroke-dashoffset: 0; fill-opacity: 1; }
      .sig-rule { animation: none; stroke-dashoffset: 0; }
      .sig-in { animation: none; }
      .sig-sparks { display: none; }
    }
  </style>

  <rect width="1200" height="230" rx="20" fill="url(#sig-bg)"/>
  <rect width="1200" height="230" rx="20" fill="url(#sig-glow)"/>

  <g class="sig-sparks" fill="#B9CBFF" opacity=".9">
    <circle cx="1003" cy="230" r="1.0"><animate attributeName="cy" values="232;79" dur="5.4s" begin="5.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="5.4s" begin="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="915" cy="230" r="1.3"><animate attributeName="cy" values="232;79" dur="6.2s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="6.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="1019" cy="230" r="1.1"><animate attributeName="cy" values="232;65" dur="6.0s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="6.0s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="779" cy="230" r="1.3"><animate attributeName="cy" values="232;63" dur="5.8s" begin="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="5.8s" begin="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="677" cy="230" r="1.1"><animate attributeName="cy" values="232;52" dur="6.0s" begin="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="6.0s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="501" cy="230" r="1.2"><animate attributeName="cy" values="232;60" dur="6.1s" begin="2.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="6.1s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="553" cy="230" r="1.6"><animate attributeName="cy" values="232;105" dur="6.2s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="6.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="181" cy="230" r="1.5"><animate attributeName="cy" values="232;49" dur="6.2s" begin="4.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="6.2s" begin="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="574" cy="230" r="1.9"><animate attributeName="cy" values="232;97" dur="6.8s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="6.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="656" cy="230" r="1.7"><animate attributeName="cy" values="232;96" dur="5.6s" begin="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="5.6s" begin="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="429" cy="230" r="1.2"><animate attributeName="cy" values="232;92" dur="4.4s" begin="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="4.4s" begin="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="608" cy="230" r="1.0"><animate attributeName="cy" values="232;68" dur="6.9s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="6.9s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="230" r="1.8"><animate attributeName="cy" values="232;55" dur="5.6s" begin="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="5.6s" begin="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1043" cy="230" r="1.6"><animate attributeName="cy" values="232;57" dur="4.5s" begin="3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="4.5s" begin="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="916" cy="230" r="1.4"><animate attributeName="cy" values="232;61" dur="4.9s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="4.9s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="948" cy="230" r="1.5"><animate attributeName="cy" values="232;97" dur="6.2s" begin="4.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="6.2s" begin="4.9s" repeatCount="indefinite"/></circle>
  </g>

  <text class="sig-serif sig-name" x="600" y="104" text-anchor="middle" font-size="76" font-style="italic" font-weight="300" letter-spacing="-1">Komal</text>

  <path class="sig-rule" d="M100 134 H1100" stroke="url(#sig-line)" stroke-width="1"/>
  <circle cx="600" cy="134" r="3" fill="#EEF2FF" class="sig-in">
    <animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <g class="sig-in">
    <text class="sig-serif" x="600" y="176" text-anchor="middle" font-size="20" font-style="italic" fill="#EEF2FF">Agents that listen. Systems that hold.</text>
    <text class="sig-mono" x="600" y="206" text-anchor="middle" font-size="11" letter-spacing="3" fill="#A5AFCB">AGENTIC AI · DISTRIBUTED SYSTEMS · NEW DELHI</text>
  </g>
</svg>
