    <g class="p1-in p1-d1">
      <text class="p1-mono" x="56" y="72" font-size="12" letter-spacing="2.6" fill="#6F8FF7">01 · AGENTIC AI · MEESHO SCRIPTEDBY{HER} 2.0 · TOP 50</text>
      <text class="p1-serif" x="54" y="146" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#EEF2FF">Sakhi<tspan class="p1-serif" font-size="22" font-style="italic" fill="#B9CBFF" dx="14">voice co-pilot for Bharat</tspan></text>
      <text class="p1-sans" x="56" y="196" font-size="17" fill="#A5AFCB">Lets Hindi-speaking Meesho resellers run their store by talking.</text>
      <text class="p1-mono" x="56" y="238" font-size="12.5" fill="#B9CBFF"><tspan fill="#6F8FF7">BUILT ›</tspan> 11-node LangGraph · 4 agents · RAG over pgvector</text>
      <line class="p1-draw" x1="56" y1="272" x2="640" y2="272" stroke="#6F8FF7" stroke-opacity=".32"/>
