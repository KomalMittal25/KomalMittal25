            <animate attributeName="fill" values="#111D4A;#4169E1;#111D4A;#111D4A" keyTimes="0;.08;.2;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.08;.2;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
          </rect>
