<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="p1-t">
  <title id="p1-t">Sakhi: a Hindi voice-native multi-agent co-pilot for Meesho resellers. Meesho ScriptedBy Her 2.0, Top 50.</title>
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1230"/><stop offset="1" stop-color="#070B1F"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="80%" cy="38%" r="55%">
      <stop offset="0" stop-color="#2647C8" stop-opacity=".55"/><stop offset="1" stop-color="#172B78" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#6F8FF7" stroke-opacity=".08"/>
    </pattern>
    <filter id="p1-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p1-clip"><rect width="1200" height="480" rx="18"/></clipPath>
    <linearGradient id="p1-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/><stop offset=".45" stop-color="#B9CBFF"/><stop offset="1" stop-color="#6F8FF7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p1-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p1-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p1-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p1-in { animation: p1-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p1-d1 { animation-delay: .15s; } .p1-d2 { animation-delay: .4s; }
    .p1-chip { animation: p1-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p1-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p1-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p1-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .p1-draw-late { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p1-draw 2.6s cubic-bezier(.65,0,.35,1) 1.4s forwards; }
    .p1-pop { animation: p1-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .p1-bar { transform-box: fill-box; transform-origin: center; animation: p1-bar 1.1s ease-in-out infinite alternate; }
    @keyframes p1-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p1-draw { to { stroke-dashoffset: 0; } }
    @keyframes p1-bar { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .p1-in, .p1-chip, .p1-pop, .p1-bar { animation: none; } .p1-draw, .p1-draw-late { animation: none; stroke-dashoffset: 0; } }
    .p1-trace { stroke-dasharray: 564 2792; stroke-dashoffset: 3356; animation: p1-trace 7s linear infinite; }
    @keyframes p1-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-trace { display: none; } }
  </style>
  <g clip-path="url(#p1-clip)">
