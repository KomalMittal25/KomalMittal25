<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="p2-t">
  <title id="p2-t">Tickless: a distributed email scheduler with zero cron jobs. BullMQ delayed jobs in Redis, a Redis sender lock and crash-safe delivery from the user's own Gmail.</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1230"/><stop offset="1" stop-color="#070B1F"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="80%" cy="38%" r="55%">
      <stop offset="0" stop-color="#2647C8" stop-opacity=".55"/><stop offset="1" stop-color="#172B78" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#6F8FF7" stroke-opacity=".08"/>
    </pattern>
    <filter id="p2-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p2-clip"><rect width="1200" height="480" rx="18"/></clipPath>
    <linearGradient id="p2-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/><stop offset=".45" stop-color="#B9CBFF"/><stop offset="1" stop-color="#6F8FF7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p2-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p2-in { animation: p2-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p2-d1 { animation-delay: .15s; } .p2-d2 { animation-delay: .4s; }
    .p2-chip { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p2-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p2-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .p2-draw-late { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p2-draw 2.6s cubic-bezier(.65,0,.35,1) 1.4s forwards; }
    .p2-pop { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .p2-bar { transform-box: fill-box; transform-origin: center; animation: p2-bar 1.1s ease-in-out infinite alternate; }
    @keyframes p2-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p2-draw { to { stroke-dashoffset: 0; } }
    @keyframes p2-bar { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .p2-in, .p2-chip, .p2-pop, .p2-bar { animation: none; } .p2-draw, .p2-draw-late { animation: none; stroke-dashoffset: 0; } }
    .p2-trace { stroke-dasharray: 564 2792; stroke-dashoffset: 3356; animation: p2-trace 7s linear infinite; }
    @keyframes p2-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-trace { display: none; } }
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="480" fill="url(#p2-bg)"/>
    <rect x="690" width="510" height="480" fill="url(#p2-grid)"/>
    <rect width="1200" height="480" fill="url(#p2-glow)"/>
    <g class="p2-in p2-d1">
      <text class="p2-mono" x="56" y="72" font-size="12" letter-spacing="2.6" fill="#6F8FF7">02 · DISTRIBUTED SYSTEMS · JOB SCHEDULING</text>
      <text class="p2-serif" x="54" y="146" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#EEF2FF">Tickless<tspan class="p2-serif" font-size="22" font-style="italic" fill="#B9CBFF" dx="14">zero cron jobs</tspan></text>
      <text class="p2-sans" x="56" y="196" font-size="17" fill="#A5AFCB">A distributed email scheduler that sends from your own Gmail.</text>
      <text class="p2-mono" x="56" y="238" font-size="12.5" fill="#B9CBFF"><tspan fill="#6F8FF7">BUILT ›</tspan> Redis SET NX PX lock · atomic hourly rate windows</text>
      <line class="p2-draw" x1="56" y1="272" x2="640" y2="272" stroke="#6F8FF7" stroke-opacity=".32"/>
    <g transform="translate(56 330)"><text class="p2-serif" font-size="36" font-weight="300" fill="#EEF2FF">0</text><text class="p2-sans" y="32" font-size="13" fill="#A5AFCB">cron jobs</text></g>
    <g transform="translate(261 330)"><text class="p2-serif" font-size="36" font-weight="300" fill="#EEF2FF">60+</text><text class="p2-sans" y="32" font-size="13" fill="#A5AFCB">Vitest unit tests</text></g>
    <g transform="translate(466 330)"><text class="p2-serif" font-size="36" font-weight="300" fill="#EEF2FF">JWT</text><text class="p2-sans" y="32" font-size="13" fill="#A5AFCB">auth + OAuth 2.0 Gmail</text></g>
      <g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="402" width="91" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="p2-mono" x="101.5" y="419" text-anchor="middle" font-size="11.5" fill="#B9CBFF">TypeScript</text></g><g class="p2-chip" style="animation-delay:1.12s"><rect x="155" y="402" width="70" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="p2-mono" x="190" y="419" text-anchor="middle" font-size="11.5" fill="#B9CBFF">Node.js</text></g><g class="p2-chip" style="animation-delay:1.24s"><rect x="233" y="402" width="63" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="p2-mono" x="264.5" y="419" text-anchor="middle" font-size="11.5" fill="#B9CBFF">BullMQ</text></g><g class="p2-chip" style="animation-delay:1.36s"><rect x="304" y="402" width="56" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="p2-mono" x="332" y="419" text-anchor="middle" font-size="11.5" fill="#B9CBFF">Redis</text></g><g class="p2-chip" style="animation-delay:1.48s"><rect x="368" y="402" width="91" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="p2-mono" x="413.5" y="419" text-anchor="middle" font-size="11.5" fill="#B9CBFF">PostgreSQL</text></g><g class="p2-chip" style="animation-delay:1.60s"><rect x="467" y="402" width="63" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="p2-mono" x="498.5" y="419" text-anchor="middle" font-size="11.5" fill="#B9CBFF">Prisma</text></g><g class="p2-chip" style="animation-delay:1.72s"><rect x="538" y="402" width="70" height="26" rx="13" fill="#111D4A" stroke="#6F8FF7" stroke-opacity=".38"/><text class="p2-mono" x="573" y="419" text-anchor="middle" font-size="11.5" fill="#B9CBFF">Next.js</text></g>
    </g>
    <g class="p2-in p2-d2"><g transform="translate(-235.2 2.4) scale(1.2)">
      <g class="p2-mono">
        <text x="772" y="92" font-size="10.5" letter-spacing="2.4" fill="#A5AFCB">BULLMQ DELAYED JOBS · REDIS · ZERO CRON</text>
        <g><rect x="772" y="112" width="134" height="26" rx="8" fill="#111D4A" stroke="#6F8FF7" stroke-opacity="0.35">
            <animate attributeName="opacity" values="1;.55;1" dur="3s" begin="0.0s" repeatCount="indefinite"/></rect>
          <text x="784" y="129" font-size="10.5" fill="#A5AFCB">c42 · send@09:30</text></g><g><rect x="772" y="146" width="134" height="26" rx="8" fill="#172B78" stroke="#B9CBFF" stroke-opacity="1">
            <animate attributeName="opacity" values="1;.55;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
          <text x="784" y="163" font-size="10.5" fill="#EEF2FF">c42 · send@09:34</text></g><g><rect x="772" y="180" width="134" height="26" rx="8" fill="#111D4A" stroke="#6F8FF7" stroke-opacity="0.35">
            <animate attributeName="opacity" values="1;.55;1" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>
          <text x="784" y="197" font-size="10.5" fill="#A5AFCB">c42 · send@09:38</text></g><g><rect x="772" y="214" width="134" height="26" rx="8" fill="#111D4A" stroke="#6F8FF7" stroke-opacity="0.35">
            <animate attributeName="opacity" values="1;.55;1" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
          <text x="784" y="231" font-size="10.5" fill="#A5AFCB">c42 · send@09:42</text></g>
        <path d="M906 125 C 932 125, 936 150, 962 158" fill="none" stroke="#6F8FF7" stroke-opacity=".45" stroke-dasharray="4 6"/>
        <path class="p2-draw" d="M906 159 H962" fill="none" stroke="#B9CBFF" stroke-width="1.5"/>
        <path d="M906 193 C 932 193, 936 168, 962 160" fill="none" stroke="#6F8FF7" stroke-opacity=".45" stroke-dasharray="4 6"/>
        <text x="938" y="106" font-size="9" letter-spacing="1" fill="#A5AFCB" text-anchor="middle">3 workers</text>
        <rect x="962" y="132" width="104" height="54" rx="12" fill="#111D4A" stroke="#C9A27A" stroke-opacity=".8"/>
        <path d="M980 152 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#C9A27A" stroke-width="1.6"/>
        <rect x="977" y="152" width="18" height="14" rx="3" fill="#C9A27A"/>
        <text x="1002" y="156" font-size="10.5" fill="#EEF2FF">sender</text>
        <text x="1002" y="172" font-size="10" fill="#C9A27A">NX PX</text>
        <path class="p2-draw" d="M1066 159 H1092" stroke="#B9CBFF" stroke-width="1.5"/>
        <rect x="1092" y="138" width="84" height="42" rx="21" fill="#172B78" stroke="#B9CBFF"/>
        <text x="1134" y="164" font-size="12" text-anchor="middle" fill="#EEF2FF">Gmail</text>
        <circle r="4.5" fill="#EEF2FF" filter="url(#p2-glowf)">
          <animateMotion dur="3.6s" repeatCount="indefinite" path="M906 159 H1134" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"/>
        </circle>
        <text x="962" y="228" font-size="9.5" letter-spacing="1.6" fill="#A5AFCB">HOURLY RATE WINDOW</text>
        <text x="1176" y="262" font-size="9.5" letter-spacing="1" fill="#B9CBFF" text-anchor="end">overflow rolls to the next hour</text>
        <rect x="962" y="238" width="214" height="6" rx="3" fill="#111D4A"/>
        <rect x="962" y="238" width="0" height="6" rx="3" fill="#4169E1">
          <animate attributeName="width" values="0;214;214;0" keyTimes="0;.7;.9;1" dur="6s" begin="1s" repeatCount="indefinite"/>
        </rect>
        <text x="1176" y="300" font-size="10.5" letter-spacing="1.5" text-anchor="end" fill="#A5AFCB">idempotent job IDs · atomic claims · orphan scanner</text>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="479" rx="17.5" fill="none" stroke="#6F8FF7" stroke-opacity=".22"/>
    <rect class="p2-trace" style="animation-delay:-3.4s" x=".5" y=".5" width="1199" height="479" rx="17.5" fill="none" stroke="url(#p2-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
